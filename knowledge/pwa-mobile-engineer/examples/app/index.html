<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets content run under the notch; env(safe-area-inset-*) pads it back. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d2a">
  <title>Flood Watch</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <h1>Flood Watch</h1>
    <button id="install-btn" type="button" hidden>Install app</button>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite">Loading forecast…</p>
    <p id="rain"></p>
    <p class="notice">Not an official warning service. Check the National Weather Service for alerts.</p>
    <p class="credit">Weather data by Open-Meteo.com</p>
  </main>

  <div id="update-banner" role="alert" hidden>
    Update available — <button id="update-btn" type="button">Reload</button>
  </div>

  <div id="ios-sheet" role="dialog" aria-labelledby="ios-sheet-title" hidden>
    <h2 id="ios-sheet-title">Add Flood Watch to your Home Screen</h2>
    <p>Tap the Share button, then <strong>Add to Home Screen</strong>.</p>
    <button id="ios-sheet-close" type="button">Not now</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
